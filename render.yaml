services:
  - type: web
    name: bulkform-api
    env: python
    region: oregon
    plan: free
    branch: main
    buildCommand: "apt-get update && apt-get install -y poppler-utils && pip install uv && uv sync --frozen"
    startCommand: "uv run uvicorn app:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0